name: Duke Treadmill Score checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Check Python syntax
        run: python -m compileall -q duke.py cli.py simulator.py enrichment.py agents tests
      - name: Run tests
        run: python -m pytest -q

  browser-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check web/calculator.js
      - name: Test browser arithmetic and validation
        run: node --test web/calculator.test.cjs

  publish-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [python, browser-math]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "github-pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static clinical calculator
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
